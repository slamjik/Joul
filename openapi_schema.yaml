  /api/grades/lms-status/:
    get:
      operationId: api_grades_lms_status_retrieve
      description: Возвращает тип активного клиента LMS, статус доступности и список
        курсов.
      summary: Статус подключения к LMS
      tags:
      - Импорт данных
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LMSStatusResponse'
          description: ''
  /api/grades/quality-levels/:
    get:
      operationId: api_grades_quality_levels_retrieve
      description: 'Количество и процент оценок: отлично, хорошо, удовл., неуд.'
      summary: Распределение уровней качества образования (для круговой диаграммы)
      parameters:
      - in: query
        name: group
        schema:
          type: integer
        description: ID группы
      - in: query
        name: semester
        schema:
          type: string
        description: Семестр
      tags:
      - Успеваемость и оценки
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeDetail'
          description: ''
  /api/grades/risk-zone/:
    get:
      operationId: api_grades_risk_zone_list
      description: Автоматически вычисляет средний балл студентов и отбирает тех,
        у кого показатель строго ниже порога RISK_THRESHOLD = 3.0. Возвращает средний
        балл и список несданных дисциплин.
      summary: Студенты в «зоне риска» (средний балл < 3.0)
      parameters:
      - in: query
        name: discipline
        schema:
          type: integer
        description: ID дисциплины
      - in: query
        name: group
        schema:
          type: integer
        description: ID учебной группы
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: semester
        schema:
          type: string
        description: Семестр (например, 2024-1)
      tags:
      - Успеваемость и оценки
      security:
      - jwtAuth: []
