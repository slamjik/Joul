  /api/grades/:
    get:
      operationId: api_grades_list
      description: 'Журнал академической успеваемости студентов:

        - Просмотр оценок с фильтрацией (группа, предмет, преподаватель, семестр,
        источник)

        - Автоматическое выявление студентов в «зоне риска» (< 3.0)

        - Динамика оценок по семестрам для линейного графика

        - Распределение по уровням качества для круговой диаграммы'
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Успеваемость и оценки
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGradeListList'
          description: ''
    post:
      operationId: api_grades_create
      description: 'Журнал академической успеваемости студентов:

        - Просмотр оценок с фильтрацией (группа, предмет, преподаватель, семестр,
        источник)

        - Автоматическое выявление студентов в «зоне риска» (< 3.0)

        - Динамика оценок по семестрам для линейного графика

        - Распределение по уровням качества для круговой диаграммы'
      tags:
