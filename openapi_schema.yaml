  /api/grades/dynamics/:
    get:
      operationId: api_grades_dynamics_list
      description: Возвращает хронологию среднего балла и % положительных оценок по
        семестрам.
      summary: Динамика успеваемости по семестрам (для линейного графика)
      parameters:
      - in: query
        name: discipline
        schema:
          type: integer
        description: ID дисциплины
      - in: query
        name: group
        schema:
          type: integer
        description: ID группы
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: teacher
        schema:
          type: integer
        description: ID преподавателя
      tags:
      - Успеваемость и оценки
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGradesDynamicsList'
