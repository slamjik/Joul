components:
  schemas:
    ActionEnum:
      enum:
      - CREATE
      - UPDATE
      - DELETE
      - LOGIN
      - IMPORT
      - EXPORT
      type: string
      description: '* `CREATE` - Создание записи

        * `UPDATE` - Изменение записи

        * `DELETE` - Удаление записи

        * `LOGIN` - Вход в систему

        * `IMPORT` - Импорт данных

        * `EXPORT` - Экспорт данных'
    AuditLogDetail:
      type: object
      description: Детальный сериализатор записи аудита со снимками изменений.
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          nullable: true
          title: Пользователь
        user_username:
          type: string
          readOnly: true
          default: Система
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          title: Тип действия
        action_display:
          type: string
          readOnly: true
        table_name:
          type: string
          title: Таблица / сущность
          description: 'Например: Workload, Grade, Student'
          maxLength: 100
        object_id:
          type: string
          title: Идентификатор объекта
          maxLength: 100
        old_value:
          nullable: true
          title: Предыдущее состояние (JSON)
        new_value:
          nullable: true
          title: Новое состояние (JSON)
        ip_address:
          type: string
          nullable: true
          title: IP-адрес клиента
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата создания
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата обновления
      required:
      - action
      - action_display
      - created_at
      - id
      - table_name
      - updated_at
      - user_username
    AuditLogList:
      type: object
      description: Облегчённый сериализатор для таблицы журнала аудита.
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          nullable: true
          title: Пользователь
        user_username:
          type: string
          readOnly: true
          default: Система
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          title: Тип действия
        action_display:
          type: string
          readOnly: true
        table_name:
          type: string
          title: Таблица / сущность
          description: 'Например: Workload, Grade, Student'
          maxLength: 100
        object_id:
          type: string
          title: Идентификатор объекта
          maxLength: 100
        ip_address:
          type: string
          nullable: true
          title: IP-адрес клиента
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата создания
      required:
      - action
      - action_display
      - created_at
      - id
      - table_name
      - user_username
    CacheInvalidateRequest:
      type: object
      description: Схема запроса принудительного сброса кэша KPI.
      properties:
        semester:
          type: string
          default: all
          description: Семестр для сброса (например, 2024-1) или 'all' для очистки
            всего кэша
    CacheInvalidateResponse:
      type: object
      description: Схема ответа после ручной инвалидации кэша KPI.
      properties:
        success:
          type: boolean
          description: Флаг успешности сброса кэша
        message:
          type: string
          description: Информационное сообщение
      required:
      - message
      - success
    CategoryEnum:
      enum:
      - clarity
      - fairness
      - relevance
      - ethics
      - facilities
      - general
      type: string
      description: '* `clarity` - Понятность и структурированность подачи материала

        * `fairness` - Объективность и прозрачность системы оценивания

        * `relevance` - Практическая ценность и актуальность содержания

        * `ethics` - Педагогический такт, этика и контакт со студентами

        * `facilities` - Организация учебного процесса и условия обучения

        * `general` - Общие впечатления и пожелания'
    ConflictCheckRequest:
      type: object
      description: Схема запроса для эндпоинта предварительной проверки пересечений.
      properties:
        teacher:
          type: integer
          description: ID преподавателя
        group:
          type: integer
          description: ID учебной группы
        room:
          type: string
          description: Номер аудитории
        semester:
          type: string
          description: Семестр, например '2024-1'
        day_of_week:
          type: integer
          description: День недели (1-6)
        lesson_number:
          type: integer
          description: Номер пары (1-7)
        exclude_id:
          type: integer
          description: ID текущей записи при редактировании
      required:
      - semester
    ConflictCheckResponse:
      type: object
      description: Схема ответа эндпоинта проверки пересечений.
      properties:
        has_conflicts:
          type: boolean
          description: Флаг наличия пересечений
        conflicts_count:
          type: integer
          description: Количество найденных конфликтов
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/WorkloadList'
          description: Список конфликтующих записей
      required:
      - conflicts
      - conflicts_count
      - has_conflicts
    DayOfWeekEnum:
      enum:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
      description: '* `1` - Понедельник

        * `2` - Вторник

        * `3` - Среда

        * `4` - Четверг

        * `5` - Пятница

        * `6` - Суббота'
    Department:
      type: object
      description: Сериализатор кафедры.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Название кафедры
          maxLength: 200
        code:
          type: string
          title: Код / аббревиатура кафедры
          maxLength: 20
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата создания
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата обновления
      required:
      - code
      - created_at
      - id
      - name
      - updated_at
    DirectionSummaryItem:
      type: object
      description: Элемент таблицы-сводки по направлениям подготовки.
      properties:
        direction_code:
          type: string
          description: Код направления (например, 09.03.01)
        direction_name:
          type: string
          description: Наименование направления
        students_count:
          type: integer
          description: Количество студентов направления
        avg_grade:
          type: number
          format: double
          description: Средний балл по направлению
        risk_count:
          type: integer
          description: Количество студентов направления в зоне риска
      required:
      - avg_grade
      - direction_code
      - direction_name
      - risk_count
      - students_count
    Discipline:
      type: object
      description: Сериализатор учебной дисциплины.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Название дисциплины
          maxLength: 300
        code:
          type: string
          title: Код дисциплины
          description: 'Например: GIS-01, INF-02'
          maxLength: 50
        total_hours:
          type: integer
          title: Всего часов по учебному плану
        lesson_type:
          allOf:
          - $ref: '#/components/schemas/LessonTypeEnum'
          title: Тип занятия
        lesson_type_display:
          type: string
