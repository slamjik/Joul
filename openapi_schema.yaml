openapi: 3.0.3
info:
  title: KafIS API — Информационная система кафедры ГиСЭН
  version: 1.0.0
  description: REST API информационной системы кафедры Гуманитарных и социально-экономических
    наук (ГиСЭН) НФ НИТУ МИСИС. Включает планирование учебной нагрузки, мониторинг
    успеваемости, расчёт KPI кафедры и экспорт отчётности.
paths:
  /api/audit/:
    get:
      operationId: api_audit_list
      description: 'Просмотр журнала аудита изменений системы KafIS.

        Доступно только заведующему кафедрой и администратору.'
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Журнал аудита
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogListList'
          description: ''
  /api/audit/{id}/:
    get:
      operationId: api_audit_retrieve
      description: 'Просмотр журнала аудита изменений системы KafIS.

        Доступно только заведующему кафедрой и администратору.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Запись аудита.
        required: true
      tags:
      - Журнал аудита
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogDetail'
          description: ''
  /api/auth/login/:
    post:
      operationId: api_auth_login_create
      description: Принимает логин и пароль. Возвращает пару токенов (access, refresh)
        и профиль пользователя с его ролью.
      summary: Авторизация пользователя (получение JWT токенов)
      tags:
      - Аутентификация
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: Успешный вход в систему
        '401':
          description: Неверный логин или пароль
  /api/auth/me/:
    get:
      operationId: api_auth_me_retrieve
      description: Возвращает ID, имя, email, роль и полномочия авторизованного пользователя.
      summary: Получение профиля текущего пользователя
      tags:
      - Аутентификация
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: api_auth_refresh_create
      description: Принимает refresh-токен и возвращает новый access-токен.
      summary: Обновление JWT access-токена
      tags:
      - Аутентификация
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/users/:
    get:
      operationId: api_auth_users_list
      description: 'CRUD для управления пользователями системы KafIS.

        Доступно только администратору (admin).'
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Управление пользователями
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserListList'
          description: ''
    post:
      operationId: api_auth_users_create
      description: 'CRUD для управления пользователями системы KafIS.

        Доступно только администратору (admin).'
      tags:
      - Управление пользователями
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserDetail'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
          description: ''
  /api/auth/users/{id}/:
    get:
      operationId: api_auth_users_retrieve
      description: 'CRUD для управления пользователями системы KafIS.

        Доступно только администратору (admin).'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Пользователь.
        required: true
      tags:
      - Управление пользователями
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
          description: ''
    put:
      operationId: api_auth_users_update
      description: 'CRUD для управления пользователями системы KafIS.

        Доступно только администратору (admin).'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Пользователь.
        required: true
      tags:
      - Управление пользователями
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserDetail'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
          description: ''
    patch:
      operationId: api_auth_users_partial_update
      description: 'CRUD для управления пользователями системы KafIS.

        Доступно только администратору (admin).'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Пользователь.
        required: true
      tags:
      - Управление пользователями
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserDetail'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
          description: ''
    delete:
      operationId: api_auth_users_destroy
      description: 'CRUD для управления пользователями системы KafIS.

        Доступно только администратору (admin).'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Пользователь.
        required: true
      tags:
      - Управление пользователями
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/disciplines/:
    get:
