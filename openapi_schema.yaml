  /api/grades/import/:
    post:
      operationId: api_grades_import_create
      description: Принимает ведомость оценок в формате Excel и сохраняет оценки в
        базу данных.
      summary: Импорт оценок студентов из Excel (.xlsx)
      tags:
      - Импорт данных
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUpload'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FileUpload'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
          description: ''
  /api/grades/import-lms/:
    post:
      operationId: api_grades_import_lms_create
      description: Запускает процедуру синхронизации оценок по выбранному курсу из
        LMS.
      summary: Импорт оценок из LMS (Moodle / Mock)
      tags:
      - Импорт данных
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LMSImportRequest'
          application/x-www-form-urlencoded:
            schema:
